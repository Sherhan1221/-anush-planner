<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7eee7">
<title>Anaxon Rasulova</title>
<style>
:root{
 --bg:#f6ebe3;--card:#fffaf6;--line:#ead9ce;--text:#4b2d29;--muted:#9a766c;
 --orange:#ed8733;--accent:#7b3f48;--consult:#9b72d6;--coach:#ed8733;--meet:#ef8fa0;--content:#6f9fe8;--admin:#d95757;--personal:#9fbe70;--danger:#c95858;
}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:linear-gradient(145deg,#f2e2d8,#fffaf6 50%,#f3e2d7);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer}
.app{max-width:1180px;margin:auto;padding:14px}
.card{background:rgba(255,250,246,.96);border:1px solid var(--line);border-radius:22px;box-shadow:0 8px 28px rgba(90,50,35,.06)}
.header{padding:18px}.headTop{display:flex;align-items:center;justify-content:space-between;gap:15px}
.redesignedHead{
 position:relative;
 min-height:190px;
 display:flex;
 flex-direction:column;
 align-items:center;
 justify-content:flex-start;
}
.redesignedHead .brand{
 width:100%;
 min-height:108px;
 display:flex;
 align-items:center;
 justify-content:center;
 gap:0;
}
.redesignedHead .brandText{text-align:center}
.redesignedHead .logo{
 position:absolute;
 left:20px;
 top:14px;
 width:78px;
 height:78px;
 font-size:35px;
 border-width:2px;
}
.redesignedHead .script{font-size:27px}
.redesignedHead .title{font-size:44px;line-height:1;margin-top:6px}
.redesignedHead .handle{
 font-size:15px;
 color:#7b3f48;
 margin-top:8px;
 font-weight:500;
}
.redesignedHead .nav{
 position:static;
 display:flex;
 justify-content:center;
 gap:10px;
 width:100%;
 margin-top:2px;
}
.redesignedHead .nav .btn{min-height:48px}
.brand{display:flex;align-items:center;gap:13px}.logo{width:64px;height:64px;border:2px solid #c98b73;border-radius:50%;display:grid;place-items:center;color:#b66d53;font:28px Georgia}.script{font:27px cursive;color:var(--orange);line-height:.8}.title{font:44px Georgia;margin:5px 0 0}.handle{color:var(--muted);font-size:13px;margin-top:3px}
.nav{display:flex;gap:8px}.btn{border:1px solid var(--line);background:#fff8f2;color:var(--text);min-height:46px;padding:0 16px;border-radius:13px}.btn.icon{width:48px;padding:0;font-size:24px}.btn.primary{background:var(--orange);border-color:var(--orange);color:#fff}
.legend{display:flex;gap:8px;overflow:auto;margin-top:15px;padding-bottom:2px}.legend button{white-space:nowrap;border:1px solid var(--line);background:#fff8f4;border-radius:12px;padding:8px 11px;color:var(--text);transition:.15s}.legend button.active{background:var(--text);color:#fff;border-color:var(--text)}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.weekCard{margin-top:12px;overflow:hidden}.weekScroll{display:block;overflow:hidden}.weekPage{width:100%;min-width:100%;overflow:hidden;padding:0;box-sizing:border-box}.weekGrid{display:grid;width:100%;grid-template-columns:52px repeat(7,minmax(0,1fr));min-width:0}.weekGrid.three{display:grid;width:100%;grid-template-columns:52px repeat(7,minmax(0,1fr));min-width:0}
.whead{background:#f8e4d9;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:10px 3px;text-align:center;font-weight:700;font-size:13px}.whead.today{background:var(--orange);color:#fff}.wtime{height:58px;border-right:1px solid var(--line);border-bottom:1px solid #eee1d8;padding:18px 5px;text-align:right;color:var(--muted);font-size:12px}.slot{height:58px;border-right:1px solid #eee1d8;border-bottom:1px solid #eee1d8;padding:4px;position:relative}
.event{display:block;width:100%;min-height:50px;border:0;border-left:4px solid;border-radius:9px;text-align:left;padding:5px 5px;color:var(--text);text-decoration:none;overflow:hidden}.event b{font-size:11px;line-height:1.15}.event small{display:block;margin-top:2px;color:#735c54;font-size:10px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.consult{background:#eadff7;border-color:#9b72d6}.coach{background:#ffe2bd;border-color:#ed8733}.meet{background:#f9dfe4;border-color:#ef8fa0}.content{background:#dce8fb;border-color:#6f9fe8}.admin{background:#f6dddd;border-color:#d95757}.personal{background:#e4efd5;border-color:#9fbe70}
.swipeHint{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;padding:10px 15px}.swipeHint b{color:var(--text)}
.bottomGrid{display:grid;grid-template-columns:1.15fr .85fr;gap:12px;margin-top:12px}.panel{padding:16px}.panel h2{font:700 25px Georgia;margin:0 0 13px}
.monthBar{display:flex;align-items:center;justify-content:space-between;gap:8px}.monthTitle{font:700 28px Georgia}.monthGrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px}.dow{text-align:center;color:var(--muted);font-size:12px;font-weight:700;padding:7px 0}.day{min-height:42px;border:0;background:transparent;border-radius:10px;color:var(--text);font-size:14px}.day.has{background:#f5e1d7}.day.today{background:var(--orange);color:#fff;font-weight:700}.day.has.today{background:var(--orange)}.day .mark{display:block;width:4px;height:4px;border-radius:50%;background:var(--orange);margin:2px auto 0}.day.today .mark{background:#fff}
.agendaRow{display:grid;grid-template-columns:46px 5px 1fr 20px;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid #eee1d8}.agendaRow .bar{height:34px;border-radius:5px}.agendaRow b{font-size:13px}.agendaRow small{font-size:12px;color:var(--muted)}
.quick{display:grid;gap:8px}.quick button{border:0;border-radius:12px;text-align:left;padding:12px 14px;color:var(--text)}.q1{background:#fde0e3}.q2{background:#ffe3bc}.q3{background:#e5efd6}.q4{background:#eee2fb}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.stat{background:#fff5ee;border-radius:12px;padding:11px}.stat strong{font-size:22px}.stat small{display:block;color:var(--muted);margin-top:2px}
.overlay{position:fixed;inset:0;background:rgba(48,28,22,.28);display:none;align-items:flex-end;justify-content:center;padding:14px;z-index:20}.overlay.open{display:flex}.modal{width:min(620px,100%);max-height:92vh;overflow:auto;background:var(--card);border-radius:22px;padding:18px;box-shadow:0 20px 60px rgba(45,25,20,.25)}.modalHead{display:flex;justify-content:space-between;align-items:center;gap:10px}.modal h2{font:700 25px Georgia;margin:0}.close{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:#fff8f2;font-size:22px}.fields{display:grid;gap:10px;margin-top:14px}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:#fffdf9;border-radius:10px;padding:11px;color:var(--text)}.field textarea{min-height:85px;resize:vertical}.formActions{display:flex;gap:8px;margin-top:15px;flex-wrap:wrap}.formActions button{flex:1 1 140px;min-width:0;padding:12px;border-radius:11px;border:1px solid var(--line);background:#f5e7dd;color:var(--text)}.formActions .save{background:var(--orange);color:#fff;border-color:var(--orange)}.danger{color:#a83f3f!important}
.detailRows{margin-top:13px}.detailRow{display:grid;grid-template-columns:105px 1fr;gap:8px;padding:10px 0;border-bottom:1px solid #eee1d8}.detailRow span{color:var(--muted);font-size:13px}.detailRow b{font-size:14px}.status{display:inline-block;padding:5px 8px;border-radius:8px;background:#f5e7dd}
.status.done{background:#e5efd6;color:#47702c}
.status.planned{background:#fff0d9;color:#9a641e}
.status.cancelled{background:#fde0e3;color:#a83f3f}
.event.status-done{opacity:.78}
.event.status-done b{text-decoration:line-through;text-decoration-thickness:1px}
.event.status-cancelled{opacity:.48}
.event.status-cancelled b{text-decoration:line-through;text-decoration-thickness:1px}
.eventStatusMark{float:right;font-weight:700;margin-left:6px}
.eventStatusMark.done{color:#4d8b55}
.eventStatusMark.cancelled{color:#b54d4d}
.eventStatusMark.planned{color:#8f817a}


.weekStats{margin-top:12px;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:rgba(255,255,255,.35)}
.weekStatsHead,.weekStatsRow{display:grid;grid-template-columns:1.35fr .65fr .65fr .65fr .65fr;align-items:center}
.weekStatsHead{padding:10px 12px;background:#f7e6dc;color:var(--muted);font-size:12px;font-weight:700}
.weekStatsRow{padding:12px;border-top:1px solid var(--line);font-size:14px}
.weekStatsRow strong{font-size:15px}
.weekStatsNum{text-align:center;font-weight:700}
.weekStatsLabel{display:flex;align-items:center;gap:8px}
.weekStatsDot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:0 0 auto}
.weekStatsFoot{padding:10px 12px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.monthStatsCard{margin-top:12px;padding:16px}
.monthStatsHead{display:flex;align-items:center;justify-content:space-between;gap:12px}
.monthStatsToggle{border:0;background:transparent;padding:0;text-align:left;display:flex;align-items:center;gap:12px;min-width:0;cursor:pointer;color:inherit}
.monthStatsToggle:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:8px}
.monthStatsLabel{display:block}
.monthStatsTitle{display:block}
.monthStatsChevron{font-size:28px;line-height:1;color:var(--accent);transition:transform .2s ease}
.monthStatsCard.collapsed .monthStatsChevron{transform:rotate(0deg)}
.monthStatsCard:not(.collapsed) .monthStatsChevron{transform:rotate(180deg)}
.monthStatsCard.collapsed .monthStatsSwipe,
.monthStatsCard.collapsed .monthStatsHint{display:none}
.monthStatsCard.collapsed{padding-bottom:16px}
.monthStatsCard.collapsed .monthStatsNavBtn{display:none}

.monthStatsLabel{font-size:13px;color:var(--muted)}
.monthStatsTitle{font:700 28px Georgia;margin-top:3px;text-transform:capitalize}
.monthStatsNav{display:flex;gap:7px}
.monthStatsSwipe{touch-action:pan-y;overflow:hidden;margin-top:12px}
.monthStatsInner{min-width:100%}
.monthStatsCards{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.monthStatCard{background:#fff5ee;border-radius:12px;padding:11px}
.monthStatCard strong{display:block;font-size:22px}
.monthStatCard small{display:block;color:var(--muted);margin-top:2px}
.monthStatsTable{margin-top:10px;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.monthStatsHeadRow,.monthStatsRow{display:grid;grid-template-columns:1.35fr .65fr .65fr .65fr .65fr;align-items:center}
.monthStatsHeadRow{padding:10px 12px;background:#f7e6dc;color:var(--muted);font-size:12px;font-weight:700}
.monthStatsRow{padding:12px;border-top:1px solid var(--line);font-size:14px}
.monthStatsNum{text-align:center;font-weight:700}
.monthStatsLabelCell{display:flex;align-items:center;gap:8px}
.monthStatsDot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:0 0 auto}
.monthStatsFoot{padding:10px 12px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.monthStatsHint{color:var(--muted);font-size:12px;margin-top:10px}

@media (max-width:760px){
  .app{padding:8px}
  .header{padding:13px}
  .redesignedHead{min-height:176px;padding-top:2px;gap:0}
  .redesignedHead .brand{min-height:104px}
  .redesignedHead .logo{width:74px;height:74px;font-size:33px;left:14px;top:12px}
  .redesignedHead .script{font-size:25px}
  .redesignedHead .title{font-size:40px;margin-top:5px}
  .redesignedHead .handle{font-size:14px;color:#7b3f48;margin-top:7px}
  .redesignedHead .nav{position:static;width:100%;justify-content:center;margin-top:3px;gap:9px}
  .redesignedHead .nav .btn{min-width:48px}

  .weekGrid{grid-template-columns:36px repeat(7,minmax(0,1fr));min-width:0}
  .whead{padding:8px 2px;font-size:10px}
  .whead small{font-size:9px}
  .wtime{height:54px;padding:17px 2px 0;font-size:9px}
  .slot{height:54px;padding:2px}
  .event{padding:4px 3px;border-left-width:3px;border-radius:7px;min-width:0}
  .event b{display:block;font-size:8px;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .event small{display:none}
  .eventStatusMark{font-size:9px;margin-left:2px}

  .bottomGrid{grid-template-columns:1fr}
  .monthGrid{gap:2px}
  .day{min-height:38px}
  .monthStatsCard{padding:14px}
  .monthStatsTitle{font-size:25px}
  .monthStatsCards{grid-template-columns:1fr 1fr}
  .monthStatsHeadRow,.monthStatsRow{grid-template-columns:1.35fr .65fr .65fr .65fr .65fr}
}

/* X2 authentication */
#authGate{position:fixed;inset:0;z-index:100;background:linear-gradient(145deg,#f2e2d8,#fffaf6 50%,#f3e2d7);display:flex;align-items:center;justify-content:center;padding:18px}
#authGate.hidden{display:none}
.authCard{width:min(430px,100%);padding:24px;background:rgba(255,250,246,.98);border:1px solid var(--line);border-radius:24px;box-shadow:0 18px 55px rgba(90,50,35,.12)}
.authLogo{width:70px;height:70px;border:2px solid #c98b73;border-radius:50%;display:grid;place-items:center;color:#b66d53;font:30px Georgia;margin:0 auto 15px}
.authTitle{text-align:center;font:700 28px Georgia;margin:0}
.authSub{text-align:center;color:var(--muted);font-size:13px;margin:7px 0 18px}
.authFields{display:grid;gap:10px}
.authFields label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
.authFields input{width:100%;border:1px solid var(--line);background:#fffdf9;border-radius:11px;padding:12px;color:var(--text);outline:none}
.authActions{display:grid;gap:8px;margin-top:14px}
.authActions button{min-height:48px;border-radius:12px;border:1px solid var(--line);background:#fff8f2;color:var(--text)}
.authActions .authPrimary{background:var(--orange);border-color:var(--orange);color:#fff}
.authMsg{min-height:20px;margin-top:10px;color:var(--danger);font-size:12px;text-align:center}
.backupTools{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}

</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<link rel="apple-touch-icon" sizes="180x180" href="./icons/icon-180.png">
<link rel="apple-touch-icon" sizes="192x192" href="./icons/icon-192.png">
<link rel="apple-touch-icon" sizes="512x512" href="./icons/icon-512.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Anaxon Rasulova">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
</head>
<body>

<div id="authGate">
  <div class="authCard">
    <div class="authLogo">AR</div>
    <h1 class="authTitle">Anaxon Rasulova</h1>
    <div class="authSub">Вход в облачный планировщик</div>
    <div class="authFields">
      <div>
        <label for="authEmail">Email</label>
        <input id="authEmail" type="email" autocomplete="email" placeholder="Введите email">
      </div>
      <div>
        <label for="authPassword">Пароль</label>
        <input id="authPassword" type="password" autocomplete="current-password" placeholder="Введите пароль">
      </div>
    </div>
    <div class="authActions">
      <button id="authLogin" class="authPrimary">Войти</button>
    </div>
    <div id="authMsg" class="authMsg"></div>
  </div>
</div>

<div class="app">
<section class="card header" id="top">
 <div class="headTop redesignedHead">
  <div class="brand">
   <div class="logo">AR</div>
   <div class="brandText">
    <div class="script">Моя</div>
    <div class="title">неделя</div>
    <div class="handle">@rasulova_anush</div>
   </div>
  </div>
  <div class="nav">
   <button class="btn icon" id="prevWeek" title="Предыдущий день">‹</button>
   <button class="btn primary" id="todayBtn" title="Вернуться к сегодняшней дате">Сегодня</button>
   <button class="btn icon" id="nextWeek" title="Следующий день">›</button>
   <button class="btn icon" id="calendarBtn">☰</button>
  </div>
 </div>
 <div class="legend">
  <button data-filter="Консультация"><i class="dot" style="background:#9b72d6"></i>Консультация</button>
  <button data-filter="Коучинг"><i class="dot" style="background:#ed8733"></i>Коучинг</button>
  <button data-filter="Личная встреча"><i class="dot" style="background:#ef8fa0"></i>Личная встреча</button>
  <button data-filter="Контент"><i class="dot" style="background:#6f9fe8"></i>Контент</button>
  <button data-filter="Админ"><i class="dot" style="background:#d95757"></i>Админ</button>
  <button data-filter="Личное"><i class="dot" style="background:#9fbe70"></i>Личное</button>
 </div>
</section>

<section class="card weekCard" id="weekCard">
 <div class="weekScroll" id="weekScroll"></div>
</section>

<div class="bottomGrid">
 <section class="card panel" id="calendarPanel">
  <div class="monthBar"><button class="btn icon" id="prevMonth">‹</button><div class="monthTitle" id="monthTitle"></div><button class="btn icon" id="nextMonth">›</button></div>
  <div class="monthGrid" id="monthGrid"></div>
 </section>
 <section class="card panel" id="todayPanel">
  <h2 id="todayTitle"></h2>
  <div id="agenda"></div>
  <h2 style="margin-top:18px">Быстрые действия</h2>
  <div class="quick">
   <button class="q1" data-add="Консультация">＋ Добавить консультацию</button>
   <button class="q2" data-add="Коучинг">＋ Добавить коучинг</button>
   <button class="q3" data-add="Личная встреча">＋ Добавить личную встречу</button>
   <button class="q4" data-add="Задача">＋ Добавить задачу</button>
  </div>

  <div class="backupTools">
   <button class="backupBtn" id="exportBtn">Экспорт JSON</button>
   <button class="backupBtn" id="importBtn">Импорт JSON</button>
   <input id="importFile" type="file" accept="application/json" hidden>
  </div>

  <h2 style="margin-top:18px">Статистика недели</h2>
  <div class="stats" id="stats"></div>
  <div class="weekStats" id="weekStats"></div>

 <section class="card monthStatsCard collapsed" id="monthStatsCard">
  <div class="monthStatsHead">
   <button type="button" class="monthStatsToggle" id="monthStatsToggle" aria-expanded="false">
    <span>
     <span class="monthStatsLabel">Статистика месяца</span>
     <span class="monthStatsTitle" id="monthStatsTitle">Сентябрь 2026</span>
    </span>
    <span class="monthStatsChevron" id="monthStatsChevron">⌄</span>
   </button>
   <div class="monthStatsNav">
    <button type="button" class="btn icon monthStatsNavBtn" id="prevStatsMonth" title="Предыдущий месяц">‹</button>
    <button type="button" class="btn icon monthStatsNavBtn" id="nextStatsMonth" title="Следующий месяц">›</button>
   </div>
  </div>
  <div class="monthStatsSwipe" id="monthStatsSwipe">
   <div id="monthStats"></div>
  </div>
  <div class="monthStatsHint">Свайпайте статистику влево/вправо или используйте стрелки месяца.</div>
 </section>
 </section>
</div>
</div>

<div class="overlay" id="detailOverlay">
 <div class="modal">
  <div class="modalHead"><h2 id="detailTitle"></h2><button class="close" data-close>×</button></div>
  <div class="detailRows" id="detailRows"></div>
  <div class="formActions"><button id="doneBtn">✓ Проведено</button><button id="plannedBtn">○ Запланировано</button><button id="cancelBtn">× Отменено</button><button id="editBtn">Изменить</button><button id="moveBtn">Перенести</button><button id="deleteBtn" class="danger">Удалить</button><button class="save" data-close>Закрыть</button></div>
 </div>
</div>

<div class="overlay" id="formOverlay">
 <div class="modal">
  <div class="modalHead"><h2 id="formTitle">Новое занятие</h2><button class="close" data-close>×</button></div>
  <form id="eventForm">
   <div class="fields">
    <div class="field"><label>Тип</label><select id="fType"><option>Консультация</option><option>Коучинг</option><option>Личная встреча</option><option>Контент</option><option>Админ</option><option>Личное</option><option>Задача</option></select></div>
    <div class="field"><label>Дата</label><input id="fDate" type="date" required></div>
    <div class="field"><label>Время</label><select id="fTime" required></select><small id="timeHint" style="display:block;margin-top:5px;color:#9a7568"></small></div>
    <div class="field"><label>Имя / название</label><input id="fName" required placeholder="Например: Нилуфар"></div>
    <div class="field"><label>Телефон</label><input id="fPhone" placeholder="+998 ..."></div>
    <div class="field"><label>Формат</label><input id="fFormat" placeholder="Офлайн (офис) / Онлайн"></div>
    <div class="field"><label>Тема</label><input id="fTopic" placeholder="Тема встречи"></div>
    <div class="field"><label>Статус</label><select id="fStatus"><option value="planned">○ Запланировано</option><option value="done">✓ Проведено</option><option value="cancelled">× Отменено</option></select></div>
    <div class="field"><label>Заметки</label><textarea id="fNotes" placeholder="Дополнительная информация"></textarea></div>
   </div>
   <div class="formActions"><button type="button" data-close>Отмена</button><button class="save" type="submit">Сохранить</button></div>
  </form>
 </div>

function minutesOf(t){
 const [h,m]=String(t).split(":").map(Number);
 return h*60+m;
}
function durationMinutes(type){
 return (type==="Консультация" || type==="Коучинг") ? 120 : 60;
}
function endMinutes(time,type){
 return minutesOf(time)+durationMinutes(type);
}
function overlaps(aStart,aEnd,bStart,bEnd){
 return aStart < bEnd && bStart < aEnd;
}
function conflictingEvent(date,time,type,ignoreId=null){
 const start=minutesOf(time), end=endMinutes(time,type);
 return events.find(e=>{
   if(e.id===ignoreId || e.date!==date) return false;
   const es=minutesOf(e.time), ee=endMinutes(e.time,e.type);
   return overlaps(start,end,es,ee);
 });
}
function updateAvailableTimes(preferredTime=null){
 const date=document.getElementById("fDate").value;
 const type=document.getElementById("fType").value;
 const select=document.getElementById("fTime");
 if(!date || !type || !select) return;

 const old=preferredTime || select.value || "14:00";
 const dur=durationMinutes(type);
 select.innerHTML="";
 let count=0;

 // Workday starts at 09:00. A 2-hour service cannot start at 20:00.
 for(let mins=9*60;mins<=20*60;mins+=30){
   if(mins+dur>21*60) continue;
   const t=String(Math.floor(mins/60)).padStart(2,"0")+":"+String(mins%60).padStart(2,"0");
   const conflict=conflictingEvent(date,t,type,editingId);
   if(!conflict){
     const opt=document.createElement("option");
     opt.value=t;
     opt.textContent=t;
     select.appendChild(opt);
     count++;
   }
 }
 if(count===0){
   const opt=document.createElement("option");
   opt.value="";
   opt.textContent="Нет свободного времени";
   select.appendChild(opt);
   select.value="";
   select.disabled=true;
 }else{
   select.disabled=false;
   const exists=[...select.options].some(o=>o.value===old);
   select.value=exists?old:select.options[0].value;
 }
 const hint=document.getElementById("timeHint");
 hint.textContent = type==="Консультация" || type==="Коучинг"
   ? "Продолжительность: 2 часа. Занятые интервалы скрыты."
   : "Продолжительность: 1 час. Занятые интервалы скрыты.";
}
function openForm(e=null,type="Консультация"){
 editingId=e?.id||null;
 document.getElementById("formTitle").textContent=e?"Изменить занятие":"Новое занятие";
 document.getElementById("fType").value=e?.type||type;
 document.getElementById("fDate").value=e?.date||iso(cursor);
 document.getElementById("fName").value=e?.name||"";
 document.getElementById("fPhone").value=e?.phone||"";
 document.getElementById("fFormat").value=e?.format||"";
 document.getElementById("fTopic").value=e?.topic||"";
 document.getElementById("fNotes").value=e?.notes||"";
 document.getElementById("fStatus").value=e?.status||"planned";
 updateAvailableTimes(e?.time||"14:00");
 openOverlay("formOverlay");
}
document.getElementById("fType").addEventListener("change",()=>updateAvailableTimes());
document.getElementById("fDate").addEventListener("change",()=>updateAvailableTimes());


const monthStatsCard=document.getElementById("monthStatsCard");
const monthStatsToggle=document.getElementById("monthStatsToggle");
monthStatsToggle.addEventListener("click",()=>{
 const open=monthStatsCard.classList.toggle("collapsed")===false;
 monthStatsToggle.setAttribute("aria-expanded",String(open));
});
document.getElementById("prevStatsMonth").addEventListener("click",()=>shiftStatsMonth(-1));
document.getElementById("nextStatsMonth").addEventListener("click",()=>shiftStatsMonth(1));

let statsTouchX=null;
const statsSwipe=document.getElementById("monthStatsSwipe");
statsSwipe.addEventListener("touchstart",e=>{
 if(e.touches.length===1) statsTouchX=e.touches[0].clientX;
},{passive:true});
statsSwipe.addEventListener("touchend",e=>{
 if(statsTouchX===null)return;
 const dx=e.changedTouches[0].clientX-statsTouchX;
 statsTouchX=null;
 if(Math.abs(dx)>55) shiftStatsMonth(dx<0?1:-1);
},{passive:true});

document.querySelectorAll(".quick [data-add]").forEach(b=>b.addEventListener("click",()=>openForm(null,b.dataset.add)));
document.querySelectorAll(".legend [data-filter]").forEach(b=>b.addEventListener("click",()=>{
  const f=b.dataset.filter;
  activeFilter = activeFilter===f ? null : f;
  document.querySelectorAll(".legend [data-filter]").forEach(x=>x.classList.toggle("active",x.dataset.filter===activeFilter));
  renderWeek();
  renderAgenda();
}));
document.getElementById("eventForm").addEventListener("submit",async e=>{
 e.preventDefault();
 const type=document.getElementById("fType").value;
 const date=document.getElementById("fDate").value;
 const time=document.getElementById("fTime").value;
 const conflict=conflictingEvent(date,time,type,editingId);
 if(conflict){
  const dur=durationMinutes(type)/60;
  alert(`Нельзя поставить занятие на ${time}. Это время пересекается с «${conflict.name}» (${conflict.time}–${String(Math.floor(endMinutes(conflict.time,conflict.type)/60)).padStart(2,"0")}:${String(endMinutes(conflict.time,conflict.type)%60).padStart(2,"0")}).\n\n${type} длится ${dur} часа.`);
  updateAvailableTimes(time);return;
 }
 if(!time){alert("Нет свободного времени для выбранной даты.");return}
 const obj={
  id:editingId||crypto.randomUUID(),type,date,time,
  name:document.getElementById("fName").value,
  phone:document.getElementById("fPhone").value,
  format:document.getElementById("fFormat").value,
  topic:document.getElementById("fTopic").value,
  notes:document.getElementById("fNotes").value,
  status:document.getElementById("fStatus").value
 };
 const oldEvents=events.map(x=>({...x}));
 if(editingId){
  const i=events.findIndex(x=>x.id===editingId);
  events[i]={...events[i],...obj};
 }else events.push(obj);
 try{await save()}catch(error){events=oldEvents;showCloudError(error);return}
 cursor=new Date(obj.date+"T12:00");
 monthCursor=new Date(cursor.getFullYear(),cursor.getMonth(),1);
 closeOverlays();renderAll();
});
document.getElementById("todayBtn").addEventListener("click",()=>{cursor=new Date(today);monthCursor=new Date(today.getFullYear(),today.getMonth(),1);renderAll();document.getElementById("weekCard").scrollIntoView({behavior:"smooth",block:"start"})});
document.getElementById("prevWeek").addEventListener("click",()=>{
 cursor=addDays(cursor,-1);
 monthCursor=new Date(cursor.getFullYear(),cursor.getMonth(),1);
 renderAll();
});
document.getElementById("nextWeek").addEventListener("click",()=>{
 cursor=addDays(cursor,1);
 monthCursor=new Date(cursor.getFullYear(),cursor.getMonth(),1);
 renderAll();
});
document.getElementById("calendarBtn").addEventListener("click",()=>document.getElementById("calendarPanel").scrollIntoView({behavior:"smooth",block:"start"}));
document.getElementById("prevMonth").addEventListener("click",()=>{monthCursor=new Date(monthCursor.getFullYear(),monthCursor.getMonth()-1,1);renderCalendar()});
document.getElementById("nextMonth").addEventListener("click",()=>{monthCursor=new Date(monthCursor.getFullYear(),monthCursor.getMonth()+1,1);renderCalendar()});

// Month swipe remains enabled. The weekly schedule always shows all 7 days.
let msx=0,msy=0;const mp=document.getElementById("calendarPanel");mp.addEventListener("touchstart",e=>{msx=e.touches[0].clientX;msy=e.touches[0].clientY},{passive:true});mp.addEventListener("touchend",e=>{let dx=e.changedTouches[0].clientX-msx,dy=e.changedTouches[0].clientY-msy;if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)){monthCursor=new Date(monthCursor.getFullYear(),monthCursor.getMonth()+(dx<0?1:-1),1);renderCalendar()}},{passive:true});


const exportBtn=document.getElementById("exportBtn");
const importBtn=document.getElementById("importBtn");
const importFile=document.getElementById("importFile");
exportBtn?.addEventListener("click",()=>{
 const payload={app:"Anaxon Rasulova",version:"X3",exportedAt:new Date().toISOString(),events};
 const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
 const url=URL.createObjectURL(blob),a=document.createElement("a");
 a.href=url;a.download=`Anushka_Planner_X2_backup_${new Date().toISOString().slice(0,10)}.json`;
 document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);
});
importBtn?.addEventListener("click",()=>importFile?.click());
importFile?.addEventListener("change",async()=>{
 const file=importFile.files?.[0];if(!file)return;
 try{
  const data=JSON.parse(await file.text());
  const incoming=Array.isArray(data)?data:data?.events;
  if(!Array.isArray(incoming))throw new Error("invalid");
  const valid=incoming.every(e=>e&&/^\d{4}-\d{2}-\d{2}$/.test(String(e.date))&&/^\d{2}:\d{2}$/.test(String(e.time))&&e.name&&e.type);
  if(!valid)throw new Error("invalid");
  if(!confirm(`Восстановить ${incoming.length} занятий? Текущие облачные данные будут заменены.`))return;
  events=incoming.map(e=>({...e,id:crypto.randomUUID()}));
  await save();renderAll();alert("Данные восстановлены.");
 }catch(error){alert("Не удалось восстановить JSON-копию.")}
 importFile.value="";
});

(async()=>{
 const {data:{session}}=await supabaseClient.auth.getSession();
 if(session?.user){await startApp(session.user)}
})();
